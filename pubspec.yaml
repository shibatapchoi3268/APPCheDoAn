name: appchedoan
description: "A comprehensive Nutrition & Diet App built with Flutter and Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  uuid: ^4.5.1
  csv: ^6.0.0

  cupertino_icons: ^1.0.8
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.3
  provider: ^6.1.2
  percent_indicator: ^4.2.3
  intl: ^0.19.0
  image_picker: ^1.2.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
